[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-markers"
version = "0.4"
description = "Digital health markers derived from wearable sensor and participant data"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "WSU CASAS Lab" }]
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "build"]

[project.urls]
Homepage = "https://github.com/WSU-CASAS/digital-markers"
Repository = "https://github.com/WSU-CASAS/digital-markers"
Issues = "https://github.com/WSU-CASAS/digital-markers/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_markers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
